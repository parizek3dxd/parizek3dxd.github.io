<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GeoČesko – hádej, kde jsi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600&family=Barlow+Condensed:wght@600;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--blue:#0b3f91;--blue-d:#072a63;--yel:#f6c500;--ink:#12213d;--bg:#f3f5f9;--card:#fff;--ok:#1f9d55}
*{box-sizing:border-box}
html,body{height:100%;margin:0;font:16px/1.4 Barlow,system-ui,sans-serif;color:var(--ink);background:var(--blue-d)}
#pano{position:fixed;inset:0;width:100%;height:100%;border:0;background:#0a1530}
.hud{position:fixed;top:max(10px,env(safe-area-inset-top));left:10px;right:10px;display:flex;gap:8px;z-index:500;pointer-events:none}
.chip{background:var(--blue);color:#fff;border:2px solid #fff;border-radius:8px;padding:4px 12px;font:700 20px/1.2 'Barlow Condensed',sans-serif;letter-spacing:.02em}
.chip b{color:var(--yel)}
#mini{position:fixed;right:10px;bottom:max(10px,env(safe-area-inset-bottom));width:min(280px,60vw);z-index:600;transition:width .2s,height .2s}
#mini.big{width:min(720px,calc(100vw - 20px))}
#mapwrap{height:170px;border:3px solid #fff;border-radius:10px;overflow:hidden;background:#cfd8e6;transition:height .2s}
#mini.big #mapwrap{height:min(60vh,520px)}
#map{height:100%}
.row{display:flex;gap:6px;margin-top:6px}
button{font:700 19px/1 'Barlow Condensed',sans-serif;letter-spacing:.03em;border:0;border-radius:8px;padding:12px 14px;cursor:pointer;background:var(--yel);color:var(--ink)}
button:disabled{opacity:.45;cursor:not-allowed}
button.sec{background:#fff;flex:0 0 auto}
button:focus-visible,input:focus-visible{outline:3px solid #fff;outline-offset:2px}
#guess{flex:1}
.panel{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(7,42,99,.78);z-index:900;padding:16px}
.panel.on{display:flex}
.card{background:var(--card);border-radius:14px;padding:22px;max-width:420px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.35)}
.card h1,.card h2{font:700 34px/1.05 'Barlow Condensed',sans-serif;margin:0 0 8px;color:var(--blue)}
.card p{margin:0 0 12px}
.card input{width:100%;padding:10px;border:2px solid #b8c3d6;border-radius:8px;font:15px monospace;margin-bottom:10px}
.big-n{font:700 56px/1 'Barlow Condensed',sans-serif;color:var(--blue)}
.small{font-size:14px;color:#51607c}
#result{background:transparent;align-items:flex-end;justify-content:flex-start;pointer-events:none;padding:0}
#result .card{pointer-events:auto;margin:10px;max-width:300px;position:relative}
#result{z-index:700}
#unused{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:800;background:var(--blue);color:#fff;border:2px solid #fff;border-radius:10px;padding:14px 20px;display:none;font-weight:600}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<iframe id="pano" title="Panorama ulice" allowfullscreen referrerpolicy="no-referrer-when-downgrade"></iframe>
<div class="hud"><div class="chip">Kolo <b id="rn">1</b>/5</div><div class="chip">Skóre <b id="sc">0</b></div></div>

<div id="mini">
  <div id="mapwrap"><div id="map"></div></div>
  <div class="row">
    <button id="guess" disabled>Klikni do mapy</button>
    <button class="sec" id="skip" title="Pokud se nezobrazil žádný snímek">Bez snímku</button>
    <button class="sec" id="grow" title="Zvětšit mapu" aria-label="Zvětšit mapu">Zvětšit</button>
  </div>
</div>


<div class="panel on" id="start">
  <div class="card">
    <h1>GeoČesko</h1>
    <p>Pět kol, pět míst v Česku. Podle snímků ulic a silnic poznej, kde jsi, a označ to na mapě. Čím blíž, tím víc bodů (max. 5 000). Když se místo nenačte, klikni na Bez snímku.</p>
    <button id="go">Hrát</button>
  </div>
</div>

<div class="panel" id="result">
  <div class="card">
    <div class="small" id="rtitle"></div>
    <div class="big-n" id="rpts"></div>
    <p id="rdist"></p>
    <button id="next">Další kolo</button>
  </div>
</div>

<div class="panel" id="end">
  <div class="card">
    <h2>Konec hry</h2>
    <div class="big-n" id="fin"></div>
    <p class="small">z 25 000 možných bodů</p>
    <p id="fsum"></p>
    <button id="again">Hrát znovu</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const ROUNDS = 5, SCALE_KM = 60; // body = 5000 * exp(-vzdálenost / SCALE_KM)
// Místa [šířka, délka] s Street View. Další přidáš pravým klikem v Google Mapách.
const LOCS = [[50.0875,14.4213],[50.0814,14.4286],[49.1951,16.6083],[49.8352,18.2923],[49.7477,13.3776],[50.7690,15.0560],[49.5938,17.2509],[48.9747,14.4745],[50.2092,15.8328],[50.0385,15.7787],[50.6607,14.0323],[50.2320,12.8712],[49.2243,17.6627],[49.3961,15.5912],[49.9385,17.9025],[50.0796,12.3739],[48.8127,14.3175],[49.1840,15.4540],[49.9484,15.2680],[49.4144,14.6578],[49.2148,15.8795],[48.8556,16.0509],[49.8686,16.3118],[48.8056,16.6378],[49.2976,17.3932],[49.9653,16.9707],[50.2294,17.2050],[50.5030,13.6362],[50.6404,13.8245],[50.4115,14.9054],[50.0283,15.2008],[49.6898,14.0104],[49.3088,14.1475],[49.0127,14.0003],[49.4405,12.9306],[49.3955,13.2951],[50.1813,12.6403],[50.7822,14.2148],[50.6855,14.5372],[50.5610,15.9127],[50.4166,16.1625],[49.3388,17.9965],[49.6840,18.3467],[49.8540,18.5417],[49.7797,18.4369],[48.8489,17.1325],[48.7590,16.8820],[49.4719,17.1128],[49.4551,17.4509],[49.0698,17.4597],[49.2778,16.9990],[49.3646,16.6454],[49.5627,15.9392],[49.6078,15.5806],[49.4306,15.2230],[49.2613,13.9018],[49.7955,12.6341],[49.7426,13.5946],[49.9638,14.0720],[50.1473,14.1029],[50.3505,14.4743],[50.5336,14.1317],[50.7243,15.1710],[50.6030,15.3350],[49.9513,15.7954],[49.7554,16.4681]];
let pool = [];
const $ = id => document.getElementById(id);
let map, guessMarker, layers = [];
let round = 0, total = 0, answer = null, guess = null, results = [];


function km(a, b){
  const R = 6371, r = Math.PI / 180;
  const dLat = (b.lat - a.lat) * r, dLng = (b.lng - a.lng) * r;
  const h = Math.sin(dLat/2)**2 + Math.cos(a.lat*r) * Math.cos(b.lat*r) * Math.sin(dLng/2)**2;
  return 2 * R * Math.asin(Math.sqrt(h));
}

function initMap(){
  if (map) return;
  map = L.map('map', {center: [49.8, 15.5], zoom: 6, minZoom: 6, maxBounds: [[48.0, 11.0], [51.7, 19.8]], zoomControl: false, attributionControl: false});
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom: 17}).addTo(map);
  L.control.attribution({prefix: false}).addAttribution('© přispěvatelé OpenStreetMap').addTo(map);
  map.on('click', e => {
    if (answer && $('result').classList.contains('on')) return;
    guess = e.latlng;
    if (guessMarker) guessMarker.setLatLng(guess); else guessMarker = L.marker(guess).addTo(map);
    $('guess').disabled = false; $('guess').textContent = 'Hádat';
  });
}

function showPlace(){
  if (!pool.length) pool = LOCS.slice().sort(() => Math.random() - .5);
  const l = pool.pop();
  answer = {lat: l[0], lng: l[1]};
  $('pano').src = `https://maps.google.com/maps?q=&layer=c&cbll=${l[0]},${l[1]}&cbp=12,${Math.floor(Math.random() * 360)},0,0,0&output=svembed`;
}

function newRound(){
  round++;
  $('rn').textContent = round;
  guess = null; answer = null;
  $('guess').disabled = true; $('guess').textContent = 'Klikni do mapy';
  layers.forEach(l => map.removeLayer(l)); layers = [];
  if (guessMarker){ map.removeLayer(guessMarker); guessMarker = null; }
  $('result').classList.remove('on');
  $('mini').classList.remove('big'); setTimeout(() => map.invalidateSize(), 250);
  map.setView([49.8, 15.5], 6);
  showPlace();
}

function submit(){
  if (!guess || !answer) return;
  const d = km(guess, answer);
  const pts = Math.round(5000 * Math.exp(-d / SCALE_KM));
  total += pts; results.push({d, pts});
  $('sc').textContent = total;
  const a = L.latLng(answer.lat, answer.lng);
  const pin = L.circleMarker(a, {radius: 9, color: '#fff', weight: 3, fillColor: '#1f9d55', fillOpacity: 1}).addTo(map);
  const line = L.polyline([guess, a], {color: '#0b3f91', weight: 3, dashArray: '6 6'}).addTo(map);
  layers.push(pin, line);
  $('mini').classList.add('big');
  setTimeout(() => { map.invalidateSize(); map.fitBounds(L.latLngBounds([guess, a]), {padding: [40, 40], maxZoom: 13}); }, 260);
  $('rtitle').textContent = `Kolo ${round} z ${ROUNDS}`;
  $('rpts').textContent = pts.toLocaleString('cs-CZ') + ' b.';
  $('rdist').textContent = d < 1 ? `Trefa na ${Math.round(d * 1000)} m.` : `Vedle o ${d.toFixed(d < 10 ? 1 : 0).replace('.', ',')} km.`;
  $('next').textContent = round >= ROUNDS ? 'Výsledky' : 'Další kolo';
  $('result').classList.add('on');
  $('guess').disabled = true;
}

function finish(){
  $('result').classList.remove('on');
  $('fin').textContent = total.toLocaleString('cs-CZ');
  $('fsum').textContent = results.map((r, i) => `${i + 1}. kolo: ${r.pts.toLocaleString('cs-CZ')} b. (${r.d.toFixed(r.d < 10 ? 1 : 0).replace('.', ',')} km)`).join('  |  ');
  $('end').classList.add('on');
}

function startGame(){
  round = 0; total = 0; results = []; $('sc').textContent = 0;
  $('end').classList.remove('on');
  newRound();
}

$('go').onclick = () => {
  $('start').classList.remove('on');
  initMap();
  startGame();
};
$('guess').onclick = submit;
$('skip').onclick = () => { if (!$('result').classList.contains('on')) showPlace(); };
$('next').onclick = () => round >= ROUNDS ? finish() : newRound();
$('again').onclick = startGame;
$('grow').onclick = () => {
  const m = $('mini'); m.classList.toggle('big');
  $('grow').textContent = m.classList.contains('big') ? 'Zmenšit' : 'Zvětšit';
  setTimeout(() => map.invalidateSize(), 250);
};
</script>
</body>
</html>
