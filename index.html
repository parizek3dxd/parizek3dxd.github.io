<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GeoČesko – poznej Česko podle ulice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--bg:#f2f5fa;--ink:#101828;--mute:#667085;--acc:#2158d6;--red:#e5383b;--ok:#12b76a;--line:#e4e9f2;--ease:cubic-bezier(.2,.8,.2,1);--sh:0 10px 30px rgba(16,24,40,.13)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;font:500 16px/1.45 Nunito,system-ui,sans-serif;color:var(--ink);background:var(--bg)}
.screen{position:fixed;inset:0;opacity:0;visibility:hidden;transform:scale(1.02);transition:opacity .5s,transform .7s var(--ease),visibility 0s .5s}
.screen.on{opacity:1;visibility:visible;transform:none;transition-delay:0s}
.bgd{background:var(--bg)}
button{font:800 16px/1 Nunito,system-ui,sans-serif;border:0;border-radius:999px;padding:14px 22px;cursor:pointer;color:#fff;background:var(--acc);transition:transform .25s var(--ease),box-shadow .25s,background .25s}
button:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 8px 20px rgba(33,88,214,.3)}
button:active:not(:disabled){transform:scale(.97)}
button:disabled{background:#cfd6e4;cursor:not-allowed}
button:focus-visible,input:focus-visible{outline:3px solid #9db8f5;outline-offset:2px}
button.ghost{background:#fff;color:var(--ink);box-shadow:0 0 0 1px var(--line),0 2px 6px rgba(16,24,40,.06)}
button.ghost:hover:not(:disabled){box-shadow:0 0 0 1px var(--line),0 8px 20px rgba(16,24,40,.12)}
button.ghost.on{background:var(--acc);color:#fff;box-shadow:none}
.sm{padding:9px 16px;font-size:15px}
#home,#end{display:flex;align-items:center;justify-content:center;text-align:center;padding:20px}
.hero{max-width:460px;width:100%}
.on .hero>*{animation:rise .8s var(--ease) both}
.hero>:nth-child(2){animation-delay:.1s!important}.hero>:nth-child(3){animation-delay:.2s!important}.hero>:nth-child(4){animation-delay:.3s!important}.hero>:nth-child(5){animation-delay:.4s!important}
@keyframes rise{from{opacity:0;transform:translateY(22px)}}
.logo{width:84px;height:84px;margin:0 auto 20px;border-radius:28px;background:#fff;display:grid;place-items:center;box-shadow:var(--sh);animation:dropin 1s cubic-bezier(.3,1.5,.5,1) both!important}
.logo svg{width:36px;height:48px}
@keyframes dropin{from{opacity:0;transform:translateY(-70px) scale(.85)}}
h1{font-size:clamp(46px,13vw,68px);line-height:1;margin:0;font-weight:800;letter-spacing:-.025em}
.tag{margin:12px 0 0;color:var(--mute);font-size:18px}
.cards{display:grid;gap:12px;margin-top:30px}
.mode{display:block;width:100%;text-align:left;padding:20px 24px;border-radius:28px}
.mode b{display:block;font-size:22px;font-weight:800}
.mode small{display:block;margin-top:4px;font:500 15px/1.35 Nunito,sans-serif;opacity:.8}
.rounds{margin-top:22px;display:inline-flex;gap:4px;padding:4px;background:#fff;border-radius:999px;box-shadow:0 0 0 1px var(--line);align-items:center;font-size:14px;color:var(--mute)}
.rounds span{padding:0 8px 0 14px}
.rounds button,.rounds button:hover:not(:disabled){background:transparent;color:var(--ink);box-shadow:none;transform:none}
.rounds button.on{background:var(--acc);color:#fff}
.credit{position:absolute;left:0;right:0;bottom:max(16px,env(safe-area-inset-bottom));font:700 14px Nunito,sans-serif;color:var(--mute)}
#pickmap,#map{position:absolute;inset:0}
.leaflet-container{background:#e8edf5;font:inherit}
.back{position:absolute;top:max(12px,env(safe-area-inset-top));left:12px;z-index:500}
.sheet{position:absolute;left:12px;right:12px;bottom:max(12px,env(safe-area-inset-bottom));max-width:560px;margin:auto;z-index:500;background:#fff;border-radius:28px;padding:18px;box-shadow:var(--sh);transform:translateY(60px);opacity:0;transition:transform .8s var(--ease) .15s,opacity .8s .15s}
.on .sheet{transform:none;opacity:1}
.sheet h2{font-size:22px;font-weight:800;margin:0 0 12px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none}
.chips button{flex:none}
.hint{margin:0 0 10px;font-size:14px;color:var(--mute);min-height:20px}
.rad{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--mute);margin-bottom:14px}
.rad input{flex:1;accent-color:var(--acc)}
.rad output{font-weight:800;color:var(--ink);min-width:56px;text-align:right}
.sheet>.cta{width:100%;font-size:18px;padding:16px}
#pano{position:absolute;inset:0;width:100%;height:100%;border:0;background:#dfe5ef}
.cover{position:absolute;inset:0;z-index:400;display:grid;place-items:center;background:var(--bg);opacity:0;pointer-events:none;transition:opacity .5s}
.cover.on{opacity:1;pointer-events:auto}
.ld{text-align:center;color:var(--mute)}
.ld i{display:block;width:38px;height:38px;margin:0 auto 14px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--acc);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.hud{position:absolute;top:max(10px,env(safe-area-inset-top));left:10px;right:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;z-index:500;pointer-events:none}
.hud>*{pointer-events:auto}
.chip{background:rgba(255,255,255,.93);backdrop-filter:blur(10px);border-radius:999px;padding:9px 16px;font-size:15px;font-weight:700;line-height:1.2;box-shadow:var(--sh)}
.chip b{color:var(--acc);font-weight:800}
.chip.by{font-size:13px;color:var(--mute);padding:6px 12px}
#mini{position:absolute;right:10px;bottom:max(10px,env(safe-area-inset-bottom));width:min(320px,calc(100vw - 20px));z-index:600;transition:width .55s var(--ease)}
#mini.big{width:min(760px,calc(100vw - 20px))}
#mapwrap{height:180px;border:4px solid #fff;border-radius:28px;overflow:hidden;box-shadow:var(--sh);transition:height .55s var(--ease)}
#mini.big #mapwrap{height:min(62vh,540px)}
#mini.done #mapwrap{height:min(52vh,500px)}
.row{display:flex;gap:6px;margin-top:8px}
.row button{padding:12px 14px;font-size:15px}
#guess{flex:1}
#mini.done .row{display:none}
.res{position:absolute;top:calc(max(10px,env(safe-area-inset-top)) + 54px);left:0;right:0;margin:auto;z-index:700;background:#fff;border-radius:28px;padding:14px 20px 18px;width:min(340px,calc(100vw - 24px));text-align:center;box-shadow:var(--sh);transform:translateY(-230%);transition:transform .8s var(--ease)}
.res.on{transform:none}
.res small{font-size:13px;color:var(--mute);font-weight:700}.res p{margin:0 0 12px;font-size:16px;color:var(--mute)}
.pts{font-size:46px;line-height:1.1;font-weight:800;color:var(--acc)}
.res button{width:100%}
.mk{width:30px;height:30px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--red);border:3px solid #fff;box-shadow:0 4px 10px rgba(0,0,0,.35);position:relative;top:4px;animation:drop .6s cubic-bezier(.3,1.5,.5,1) both}
.mk i{position:absolute;inset:6px;border-radius:50%;background:#fff}
.mk.ans{background:var(--ok)}
.mk.ans::after{content:'';position:absolute;inset:-14px;border-radius:50%;border:3px solid var(--ok);animation:ring 1.6s ease-out infinite}
@keyframes drop{from{opacity:0;translate:0 -46px}}
@keyframes ring{from{transform:scale(.4);opacity:1}to{transform:scale(1.4);opacity:0}}
path.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.1s var(--ease) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
#end .hero{max-width:440px;background:#fff;border-radius:32px;padding:32px 26px;box-shadow:var(--sh)}
#end small{color:var(--mute);font-weight:700}
#etitle{font-size:28px;font-weight:800;margin:2px 0 0}
.fin{font-size:clamp(64px,18vw,92px);line-height:1.1;font-weight:800;color:var(--acc)}
.bars{margin:18px 0 24px;display:grid;gap:10px;text-align:left}
.bar{display:grid;grid-template-columns:20px 1fr 64px;gap:10px;align-items:center;font-weight:700;font-size:15px}
.bar div{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--acc);border-radius:5px;transition:width 1.3s var(--ease) .5s}
.on .bar i{width:var(--w)}
.bar em{font-style:normal;text-align:right}
.acts{display:grid;gap:10px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><symbol id="pinsvg" viewBox="0 0 48 64"><path d="M24 3C12 3 3 12 3 24c0 16 21 38 21 38s21-22 21-38C45 12 36 3 24 3z" fill="#e5383b" stroke="#fff" stroke-width="3.5"/><circle cx="24" cy="24" r="8.5" fill="#fff"/></symbol></svg>

<main class="screen bgd on" id="home">
  <div class="hero">
    <div class="logo"><svg><use href="#pinsvg"/></svg></div>
    <h1>GeoČesko</h1>
    <p class="tag">Poznej Česko podle ulice. Rozhlédni se, najdi si na mapě, kde jsi.</p>
    <div class="cards">
      <button class="mode" id="playAll"><b>Hrát</b><small>Celá republika, všech 14 krajů včetně venkova</small></button>
      <button class="mode ghost" id="playPick"><b>Vybrat lokalitu</b><small>Zvol kraj nebo si na mapě nakresli vlastní okruh</small></button>
    </div>
    <div class="rounds" id="rounds"><span>Počet kol</span><button class="ghost sm" data-r="3">3</button><button class="ghost sm on" data-r="5">5</button><button class="ghost sm" data-r="10">10</button></div>
  </div>
  <div class="credit">by Parizek3DXD</div>
</main>

<section class="screen" id="pick">
  <div id="pickmap"></div>
  <button class="ghost back" id="pickBack">Zpět</button>
  <div class="sheet">
    <h2>Kde chceš hrát?</h2>
    <div class="chips" id="chips"></div>
    <div class="hint" id="hint">Vyber kraj, nebo klikni do mapy a nastav okruh.</div>
    <label class="rad">Okruh <input type="range" id="rad" min="2" max="150" value="25"><output id="rv">25 km</output></label>
    <button class="cta" id="pickGo" disabled>Hrát</button>
  </div>
</section>

<section class="screen" id="game">
  <iframe id="pano" title="Panorama ulice" allowfullscreen referrerpolicy="no-referrer-when-downgrade"></iframe>
  <div class="cover on" id="cover"><div class="ld"><i></i><p>Hledám místo na silnici…</p></div></div>
  <div class="hud">
    <button class="ghost sm" id="exit">Domů</button>
    <div class="chip">Kolo <b id="rn">1/5</b></div>
    <div class="chip">Skóre <b id="sc">0</b></div>
    <div class="chip by">by Parizek3DXD</div>
  </div>
  <div id="mini">
    <div id="mapwrap"><div id="map"></div></div>
    <div class="row"><button id="guess" disabled>Klikni do mapy</button><button class="ghost" id="skip" title="Pokud se nezobrazil žádný snímek">Bez snímku</button><button class="ghost" id="grow">Zvětšit</button></div>
  </div>
  <div class="res" id="res"><small id="rt"></small><div class="pts" id="rp">0</div><p id="rd"></p><button id="next">Další kolo</button></div>
</section>

<section class="screen bgd" id="end">
  <div class="hero">
    <small>Výsledek</small>
    <h2 id="etitle"></h2>
    <div class="fin" id="fin">0</div>
    <div class="bars" id="bars"></div>
    <div class="acts"><button id="again">Hrát znovu</button><button class="ghost" id="toHome">Domů</button></div>
  </div>
  <div class="credit">by Parizek3DXD</div>
</section>

<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const $ = id => document.getElementById(id), Q = s => document.querySelectorAll(s);
const fmt = n => n.toLocaleString('cs-CZ');
const TILE = 'https://tile.openstreetmap.org/{z}/{x}/{y}.png';

// 14 krajů; každý je pokrytý kruhy kolem měst [šířka, délka, poloměr km]. Z nich se generuje 1 000 lokalit na kraj.
const KR = [
['Praha','50.08,14.44,13'],
['Středočeský','50.15,14.10,25;50.41,14.90,25;50.03,15.20,22;49.78,14.69,25;49.69,14.01,28;49.96,14.07,14;50.35,14.47,18;50.10,13.73,20;50.19,15.04,14'],
['Jihočeský','48.97,14.47,30;49.41,14.66,22;49.31,14.15,20;49.26,13.90,18;49.14,15.00,25;48.80,14.30,22;49.01,14.00,18'],
['Plzeňský','49.75,13.38,25;49.44,12.93,20;49.40,13.30,20;49.80,12.63,20;49.74,13.59,14;49.23,13.52,14'],
['Karlovarský','50.23,12.87,20;50.08,12.37,18;50.18,12.64,15;49.96,12.70,12'],
['Ústecký','50.66,14.03,22;50.50,13.64,20;50.64,13.82,12;50.78,14.21,18;50.53,14.13,15;50.36,13.80,18;50.46,13.42,18;50.95,14.55,12'],
['Liberecký','50.77,15.06,18;50.72,15.17,12;50.69,14.54,20;50.60,15.33,16;50.92,15.08,12'],
['Královéhradecký','50.21,15.83,20;50.56,15.91,18;50.42,16.16,16;50.44,15.35,18;50.16,16.28,16'],
['Pardubický','50.04,15.78,18;49.95,15.79,14;49.76,16.47,20;49.97,16.39,18;50.09,16.47,12'],
['Vysočina','49.40,15.59,22;49.61,15.58,20;49.21,15.88,20;49.56,15.94,22;49.43,15.22,20;49.36,16.01,12'],
['Jihomoravský','49.20,16.61,22;48.86,16.05,22;48.76,16.88,18;48.85,17.13,18;49.36,16.65,16;49.28,17.00,15;48.81,16.64,12'],
['Olomoucký','49.59,17.25,20;49.47,17.11,14;49.45,17.45,15;49.97,16.97,20;50.23,17.20,18;49.55,17.73,10'],
['Zlínský','49.22,17.66,18;49.07,17.46,16;49.30,17.39,14;49.34,18.00,18;49.47,17.97,10'],
['Moravskoslezský','49.83,18.29,20;49.94,17.90,18;49.85,18.54,12;49.68,18.35,16;49.59,18.01,14;49.99,17.46,20;49.68,18.67,12']
];
const KC = KR.map(k => k[1].split(';').map(s => s.split(',').map(Number)));
const KW = KC.map(cs => Math.max(1500, cs.reduce((s, c) => s + c[2] ** 2, 0)));
const CZ = [[12.09,50.25],[12.20,50.32],[12.40,50.42],[12.95,50.42],[13.50,50.60],[14.25,50.87],[14.60,51.05],[15.00,51.05],[15.28,50.99],[15.35,50.80],[16.00,50.60],[16.45,50.60],[16.90,50.43],[17.20,50.38],[17.70,50.25],[18.05,50.05],[18.55,49.90],[18.85,49.52],[18.55,49.45],[18.00,49.30],[17.60,48.95],[17.20,48.85],[16.95,48.62],[16.45,48.77],[16.00,48.78],[15.30,48.98],[14.95,48.75],[14.70,48.58],[14.45,48.65],[14.00,48.62],[13.80,48.77],[13.40,48.95],[12.95,49.35],[12.50,49.68],[12.40,49.95]];

function inCZ(lng, lat){
  let c = false;
  for (let i = 0, j = CZ.length - 1; i < CZ.length; j = i++){
    const [xi, yi] = CZ[i], [xj, yj] = CZ[j];
    if ((yi > lat) !== (yj > lat) && lng < (xj - xi) * (lat - yi) / (yj - yi) + xi) c = !c;
  }
  return c;
}
function km(a, b){
  const r = Math.PI / 180, dLa = (b.lat - a.lat) * r, dLn = (b.lng - a.lng) * r;
  const h = Math.sin(dLa / 2) ** 2 + Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin(dLn / 2) ** 2;
  return 12742 * Math.asin(Math.sqrt(h));
}
function rng(a){ return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function inCircle(c, rnd){
  const a = rnd() * 6.2832, d = Math.sqrt(rnd()) * c[2];
  return {lat: c[0] + d * Math.cos(a) / 111.2, lng: c[1] + d * Math.sin(a) / (111.2 * Math.cos(c[0] * Math.PI / 180))};
}
function pickC(cs, rnd){
  let t = cs.reduce((s, c) => s + c[2] ** 2, 0) * rnd();
  for (const c of cs){ t -= c[2] ** 2; if (t <= 0) return c; }
  return cs[0];
}
function pickKraj(){ let t = Math.random() * KW.reduce((a, b) => a + b); for (let i = 0; i < KW.length; i++){ t -= KW[i]; if (t <= 0) return i; } return 1; }

// Přichytí bod k nejbližší silnici (veřejné OSRM API, bez klíče), tam Street View skoro jistě je.
async function snap(p){
  const ac = new AbortController(), t = setTimeout(() => ac.abort(), 5000);
  try {
    const j = await (await fetch(`https://router.project-osrm.org/nearest/v1/driving/${p.lng},${p.lat}`, {signal: ac.signal})).json();
    const w = j.waypoints && j.waypoints[0];
    if (w && w.distance < 4000) return {lat: w.location[1], lng: w.location[0]};
  } catch (e) {} finally { clearTimeout(t); }
  return null;
}
async function makePlace(src){
  const k = src.t === 'circle' ? null : (src.t === 'kraj' ? src.k : pickKraj()), idx = Math.random() * 1000 | 0;
  for (let t = 0; t < 10; t++){
    let p;
    if (k == null) p = inCircle([src.c.lat, src.c.lng, src.r], Math.random);
    else { const rnd = rng(k * 100003 + idx * 31 + t); p = inCircle(pickC(KC[k], rnd), rnd); }
    if (!inCZ(p.lng, p.lat)) continue;
    const s = await snap(p);
    if (s && inCZ(s.lng, s.lat) && (k != null || km(s, src.c) <= src.r * 1.15)) return s;
  }
  if (k == null) return {lat: src.c.lat, lng: src.c.lng};
  const c = pickC(KC[k], Math.random); return {lat: c[0], lng: c[1]};
}

function areaBounds(src){
  const cs = src.t === 'kraj' ? KC[src.k] : src.t === 'circle' ? [[src.c.lat, src.c.lng, src.r]] : null;
  if (!cs) return L.latLngBounds([48.55, 12.09], [51.06, 18.86]);
  const b = L.latLngBounds();
  cs.forEach(c => { const dy = c[2] / 111.2, dx = dy / Math.cos(c[0] * Math.PI / 180); b.extend([c[0] - dy, c[1] - dx]); b.extend([c[0] + dy, c[1] + dx]); });
  return b;
}
const circ = (lat, lng, r) => L.circle([lat, lng], {radius: r * 1000, color: '#2158d6', weight: 2, dashArray: '6 6', fillColor: '#2158d6', fillOpacity: .12, interactive: false});
const pin = c => L.divIcon({className: '', iconSize: [30, 40], iconAnchor: [15, 40], html: `<div class="mk ${c}"><i></i></div>`});
function mkMap(id, minZ){
  const m = L.map(id, {zoomControl: false, attributionControl: false, minZoom: minZ, maxBounds: [[47.6, 11.2], [51.9, 19.6]], maxBoundsViscosity: .8, zoomSnap: .25, center: [49.8, 15.5], zoom: 7});
  L.tileLayer(TILE, {maxZoom: 18, attribution: '© přispěvatelé OpenStreetMap'}).addTo(m);
  L.control.attribution({prefix: false, position: 'topright'}).addTo(m);
  return m;
}
function tween(el, to, ms, from){
  const t0 = performance.now();
  (function f(t){ const p = Math.min(1, (t - t0) / ms), e = 1 - Math.pow(1 - p, 3); el.textContent = fmt(Math.round(from + (to - from) * e)); if (p < 1) requestAnimationFrame(f); })(t0);
}
let pm, gm, ROUNDS = 5, G = null, PK = {k: null, c: null, r: 25}, pLay = [], aLay = [];
function show(id){
  Q('.screen').forEach(s => s.classList.toggle('on', s.id === id));
  if (id === 'pick'){ initPick(); setTimeout(() => pm.invalidateSize(), 80); }
  if (id !== 'game') $('pano').src = 'about:blank';
}

// ---------- výběr lokality ----------
function initPick(){
  if (pm) return;
  pm = mkMap('pickmap', 6); pm.fitBounds(areaBounds({t: 'cr'}), {paddingBottomRight: [10, 260]});
  KR.forEach((k, i) => { const b = document.createElement('button'); b.className = 'ghost sm'; b.textContent = k[0]; b.onclick = () => { PK = {k: i, c: null, r: PK.r}; renderPick(true); }; $('chips').appendChild(b); });
  pm.on('click', e => {
    if (!inCZ(e.latlng.lng, e.latlng.lat)){ $('hint').textContent = 'Vyber místo uvnitř České republiky.'; return; }
    PK = {k: null, c: e.latlng, r: PK.r}; renderPick(true);
  });
}
function renderPick(fit){
  pLay.forEach(l => pm.removeLayer(l)); pLay = [];
  const {k, c} = PK;
  Q('#chips button').forEach((b, i) => b.classList.toggle('on', i === k));
  if (k != null){ KC[k].forEach(x => pLay.push(circ(x[0], x[1], x[2]).addTo(pm))); $('hint').textContent = `${KR[k][0]}: 1 000 lokalit včetně venkova`; }
  else if (c){ pLay.push(circ(c.lat, c.lng, PK.r).addTo(pm), L.marker(c, {icon: pin(''), interactive: false}).addTo(pm)); $('hint').textContent = `Okruh ${PK.r} km kolem vybraného místa`; }
  $('pickGo').disabled = k == null && !c; $('rad').disabled = k != null;
  if (fit) pm.flyToBounds(areaBounds(k != null ? {t: 'kraj', k} : {t: 'circle', c, r: PK.r}), {paddingTopLeft: [30, 60], paddingBottomRight: [30, 300], duration: .9, maxZoom: 12});
}
$('rad').oninput = e => { PK.r = +e.target.value; $('rv').textContent = PK.r + ' km'; if (PK.c) renderPick(false); };
$('pickGo').onclick = () => startGame(PK.k != null ? {t: 'kraj', k: PK.k} : {t: 'circle', c: PK.c, r: PK.r});

// ---------- hra ----------
function startGame(src){
  G = {src, n: ROUNDS, r: 0, total: 0, res: [], lock: false, next: null, lay: [], gm: null,
       sc: src.t === 'cr' ? 60 : src.t === 'kraj' ? 22 : Math.max(2, src.r * .45)};
  show('game');
  if (!gm){
    gm = mkMap('map', 5);
    gm.on('click', e => {
      if (!G || G.lock) return;
      G.guess = e.latlng;
      if (G.gmk) G.gmk.setLatLng(e.latlng); else G.gmk = L.marker(e.latlng, {icon: pin(''), interactive: false}).addTo(gm);
      $('guess').disabled = false; $('guess').textContent = 'Hádat';
    });
  }
  aLay.forEach(l => gm.removeLayer(l)); aLay = [];
  if (src.t === 'kraj') KC[src.k].forEach(x => aLay.push(circ(x[0], x[1], x[2]).addTo(gm)));
  if (src.t === 'circle') aLay.push(circ(src.c.lat, src.c.lng, src.r).addTo(gm));
  $('sc').textContent = 0;
  nextRound();
}
function nextRound(){
  G.r++; G.lock = false; G.guess = null; G.ans = null;
  $('rn').textContent = G.r + '/' + G.n;
  $('guess').disabled = true; $('guess').textContent = 'Klikni do mapy';
  G.lay.forEach(l => gm.removeLayer(l)); G.lay = [];
  if (G.gmk){ gm.removeLayer(G.gmk); G.gmk = null; }
  $('res').classList.remove('on'); $('mini').classList.remove('big', 'done'); $('grow').textContent = 'Zvětšit';
  setTimeout(() => { gm.invalidateSize(); gm.fitBounds(areaBounds(G.src), {padding: [14, 14]}); }, 120);
  loadPlace();
}
async function loadPlace(){
  const g = G, my = G.r;
  $('cover').classList.add('on');
  const p = await (g.next || makePlace(g.src)); g.next = null;
  if (G !== g || g.r !== my) return;
  g.ans = p;
  $('pano').src = `https://maps.google.com/maps?q=&layer=c&cbll=${p.lat},${p.lng}&cbp=12,${Math.floor(Math.random() * 360)},0,0,0&output=svembed`;
  setTimeout(() => $('cover').classList.remove('on'), 6500);
  g.next = makePlace(g.src);
}
$('pano').onload = () => setTimeout(() => $('cover').classList.remove('on'), 400);

function submit(){
  if (!G.guess || !G.ans || G.lock) return;
  G.lock = true;
  const d = km(G.guess, G.ans), pts = Math.round(5000 * Math.exp(-d / G.sc)), a = L.latLng(G.ans.lat, G.ans.lng);
  G.total += pts; G.res.push({d, pts});
  $('guess').disabled = true;
  $('mini').classList.add('big', 'done');
  setTimeout(() => { gm.invalidateSize(); gm.fitBounds(L.latLngBounds([G.guess, a]), {padding: [60, 60], maxZoom: 13, duration: .9, animate: true}); }, 560);
  setTimeout(() => {
    const m = L.marker(a, {icon: pin('ans'), interactive: false}).addTo(gm);
    const ln = L.polyline([G.guess, a], {color: '#e5383b', weight: 4, className: 'draw'}).addTo(gm);
    ln._path.setAttribute('pathLength', '1');
    G.lay.push(m, ln);
  }, 1300);
  setTimeout(() => {
    $('rt').textContent = `Kolo ${G.r} z ${G.n}`;
    $('rd').textContent = d < 1 ? `Trefa na ${Math.round(d * 1000)} m` : `Vedle o ${d.toFixed(d < 10 ? 1 : 0).replace('.', ',')} km`;
    $('next').textContent = G.r >= G.n ? 'Výsledky' : 'Další kolo';
    $('res').classList.add('on');
    tween($('rp'), pts, 1100, 0); tween($('sc'), G.total, 1100, G.total - pts);
  }, 2100);
}
function finish(){
  const pct = G.total / (G.n * 5000);
  $('etitle').textContent = pct > .9 ? 'Žijící mapa' : pct > .7 ? 'Zeměpisný mistr' : pct > .45 ? 'Slušný navigátor' : pct > .2 ? 'Turista s mapou' : 'Ztracený na Vysočině';
  $('bars').innerHTML = G.res.map((r, i) => `<div class="bar"><span>${i + 1}</span><div><i style="--w:${r.pts / 50}%"></i></div><em>${fmt(r.pts)}</em></div>`).join('');
  $('fin').textContent = 0; show('end'); setTimeout(() => tween($('fin'), G.total, 1500, 0), 500);
}

$('playAll').onclick = () => startGame({t: 'cr'});
$('playPick').onclick = () => show('pick');
$('pickBack').onclick = () => show('home');
$('exit').onclick = () => show('home');
$('toHome').onclick = () => show('home');
$('again').onclick = () => startGame(G.src);
$('guess').onclick = submit;
$('next').onclick = () => G.r >= G.n ? finish() : nextRound();
$('skip').onclick = () => { if (G && !G.lock){ G.ans = null; loadPlace(); } };
$('grow').onclick = () => { const m = $('mini'); m.classList.toggle('big'); $('grow').textContent = m.classList.contains('big') ? 'Zmenšit' : 'Zvětšit'; setTimeout(() => gm.invalidateSize(), 600); };
Q('#rounds button').forEach(b => b.onclick = () => { ROUNDS = +b.dataset.r; Q('#rounds button').forEach(x => x.classList.toggle('on', x === b)); });
</script>
</body>
